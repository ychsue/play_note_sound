<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON 樂譜播放器</title>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        background: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 500px;
      }
      h2 {
        color: #333;
        margin-top: 0;
      }
      .control-group {
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: bold;
        color: #666;
      }
      input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px dashed #ccc;
        border-radius: 6px;
        cursor: pointer;
      }
      textarea {
        width: 100%;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-family: monospace;
        padding: 10px;
        box-sizing: border-box;
        background: #fafafa;
      }
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #4caf50;
        color: white;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background: #45a049;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .status {
        margin-top: 10px;
        font-size: 0.9rem;
        color: #888;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>🎸 JSON 樂譜播放器</h2>

      <div class="control-group">
        <label for="fileInput">上傳樂譜 (.json)</label>
        <input
          type="file"
          id="fileInput"
          accept=".json"
          onchange="getJsonFile(this)"
        />
        <button
          href="sample.json"
          style="
            display: block;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #ff7bff;
          "
          onclick="loadSampleJson()"
          >載入範例樂譜</button
        >
      </div>

      <div class="control-group">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <label>樂譜內容</label>
          <label style="font-size: 0.8rem; cursor: pointer">
            <input
              type="checkbox"
              id="modeSwitch"
              onchange="toggleEditMode()"
            />
            編輯模式
          </label>
        </div>

        <textarea
          id="jsonSummary"
          rows="8"
          readonly
          placeholder="上傳後顯示摘要..."
        ></textarea>

        <textarea
          id="jsonEditor"
          rows="12"
          style="display: none"
          placeholder="請在此編輯 JSON..."
        ></textarea>
      </div>
      <button id="playButton" disabled onclick="playNotes()">開始播放</button>
      <div id="status" class="status">準備就緒</div>
    </div>

    <script src="music_core.js"></script>
    <script src="main.js"></script>
  </body>
</html>
