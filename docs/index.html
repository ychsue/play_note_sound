<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON 樂譜播放器</title>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        background: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 500px;
      }
      h2 {
        color: #333;
        margin-top: 0;
      }
      .control-group {
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: bold;
        color: #666;
      }
      input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px dashed #ccc;
        border-radius: 6px;
        cursor: pointer;
      }
      textarea {
        width: 100%;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-family: monospace;
        padding: 10px;
        box-sizing: border-box;
        background: #fafafa;
      }
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #4caf50;
        color: white;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background: #45a049;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .status {
        margin-top: 10px;
        font-size: 0.9rem;
        color: #888;
        text-align: center;
      }
      /* 滾動視窗容器 */
      #scroller-container {
        width: 100%;
        height: 80px;
        background: #222;
        overflow: hidden;
        position: relative;
        margin-bottom: 20px;
        border-radius: 8px;
        border: 2px solid #444;
      }
      /* 中央指標線 */
      #play-head {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #ff4757;
        z-index: 10;
        box-shadow: 0 0 5px rgba(255, 71, 87, 0.8);
      }
      /* 實際移動的軌道 */
      #lyrics-track {
        display: flex;
        position: absolute;
        left: 50%; /* 起點從中間開始 */
        height: 100%;
        align-items: center;
        transition: transform 0.1s linear;
        will-change: transform;
      }
      .note-item {
        flex-shrink: 0;
        height: 58px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        gap: 2px;
        padding-left: 8px;
        color: #aaa;
        border-left: 1px solid #333;
        cursor: pointer;
        transition: all 0.2s;
      }
      .note-word {
        font-size: 1.25rem;
        line-height: 1.1;
      }
      .note-meta {
        font-size: 0.72rem;
        color: #808080;
        line-height: 1;
      }
      .note-item.active {
        color: #fff;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.1);
      }
      .note-item.active .note-word {
        font-size: 1.5rem;
      }
      .note-item.active .note-meta {
        color: #d3d3d3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>🎸 JSON 樂譜播放器</h2>

      <div class="control-group">
        <label for="fileInput">上傳樂譜 (.json)</label>
        <input
          type="file"
          id="fileInput"
          accept=".json"
          onchange="getJsonFile(this)"
        />
        <button
          href="sample.json"
          style="
            display: block;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #ff7bff;
          "
          onclick="loadSampleJson()"
        >
          載入範例樂譜
        </button>
      </div>

      <div class="control-group">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <label>樂譜內容</label>
          <label style="font-size: 0.8rem; cursor: pointer">
            <input
              type="checkbox"
              id="modeSwitch"
              onchange="toggleEditMode()"
            />
            編輯模式
          </label>
        </div>

        <textarea
          id="jsonSummary"
          rows="8"
          readonly
          placeholder="上傳後顯示摘要..."
        ></textarea>

        <textarea
          id="jsonEditor"
          rows="12"
          style="display: none"
          placeholder="請在此編輯 JSON..."
        ></textarea>
      </div>

      <div id="scroller-container">
        <div id="play-head"></div>
        <div id="lyrics-track"></div>
      </div>

      <div class="button-group" style="display: flex; gap: 10px">
        <button id="playButton" onclick="handlePlay()">Play</button>
        <button id="pauseButton" onclick="handlePause()">Pause</button>
        <button id="stopButton" onclick="handleStop()">Stop</button>
      </div>
      <div id="status" class="status">準備就緒</div>
    </div>

    <script src="music_core.js"></script>
    <script src="main.js"></script>
  </body>
</html>
